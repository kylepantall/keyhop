name: Release

# Push a tag vX.Y.Z (matching package.json) to publish the Windows build.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match package.json $version" }
      - run: bun install --frozen-lockfile
      - run: bun run build:helper
      - run: bun test tests
      - name: Build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          ./dist/keyhop/keyhop.exe --version
          ./dist/keyhop/native/build/keyhop-hello.exe probe
          if ($LASTEXITCODE -ne 0) { throw 'keyhop-hello probe failed' }
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/keyhop-windows-x64.zip dist/SHA256SUMS --title $env:GITHUB_REF_NAME --generate-notes
